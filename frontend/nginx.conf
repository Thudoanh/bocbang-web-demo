server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Let React Router resolve deep links and OAuth callback routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
