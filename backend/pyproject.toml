[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bocbang-api"
version = "0.1.0"
description = "FastAPI foundation for Bóc Băng AI"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "boto3>=1.35,<2",
  "dramatiq[redis]>=1.17,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "websockets>=13,<16",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "reportlab>=4.2,<5",
  "redis>=5,<6",
  "speechmatics-batch>=1.1,<2",
  "speechmatics-rt>=1.2,<2",
  "speechmatics-voice>=0.2.8,<0.3",
  "python-docx>=1.1,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
